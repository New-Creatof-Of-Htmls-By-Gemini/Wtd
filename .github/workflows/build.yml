name: PartyBox Server

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # Force headless GStreamer and disable winegstreamer in CI
    env:
      GST_VIDEOSINK: fakesink
      GST_AUDIOSINK: fakesink
      GST_DEBUG: "2"
      GST_PLUGIN_SYSTEM_PATH: /usr/lib/x86_64-linux-gnu/gstreamer-1.0
      GST_PLUGIN_PATH: /usr/lib/x86_64-linux-gnu/gstreamer-1.0
      GST_REGISTRY: /tmp/gstreamer_registry.bin
      GST_DISABLE_REGISTRY_UPDATE: "1"
      GST_DEBUG_NO_COLOR: "1"
      WINEDLLOVERRIDES: "winegstreamer=d;winevulkan=d"

    steps:
      - uses: actions/checkout@v3

      - name: Enable i386 architecture & Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32:i386 xvfb x11vnc curl unzip p7zip-full \
            pulseaudio fluxbox novnc websockify libgl1 libglx-mesa0 libgl1-mesa-dri jq \
            winetricks cabextract mesa-utils wmctrl xdotool imagemagick \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools || true

      - name: Verify GStreamer and plugins (debug)
        run: |
          gst-launch-1.0 --version || true
          gst-inspect-1.0 --plugin filesrc || true
          gst-inspect-1.0 playbin || true

      - name: Install official Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Download and Extract wtd.zip from Release E
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p game_files
          echo "=== Скачиваем только wtd.zip из Релиза E ==="
          gh release download E --pattern "wtd.zip" --dir . --clobber

          if [ -f "wtd.zip" ]; then
            echo "Распаковка wtd.zip в game_files..."
            7z x "wtd.zip" -ogame_files/ -y
            rm -f wtd.zip
          else
            echo "ОШИБКА: wtd.zip не найден в релизе E!"
            exit 1
          fi

      - name: Setup Display & Audio
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 2
          export DISPLAY=:99
          fluxbox &
          sleep 2

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=dummy || true
          pactl set-default-sink dummy || true

          sleep 3

      - name: Install Wine Libraries for Unity & Media
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          export WINEARCH=win64

          # propagate GST envs into this shell
          export GST_VIDEOSINK=${GST_VIDEOSINK:-fakesink}
          export GST_AUDIOSINK=${GST_AUDIOSINK:-fakesink}
          export GST_DEBUG=${GST_DEBUG:-2}
          export GST_PLUGIN_SYSTEM_PATH=${GST_PLUGIN_SYSTEM_PATH:-/usr/lib/x86_64-linux-gnu/gstreamer-1.0}
          export GST_REGISTRY=${GST_REGISTRY:-/tmp/gstreamer_registry.bin}
          export GST_DISABLE_REGISTRY_UPDATE=${GST_DISABLE_REGISTRY_UPDATE:-1}
          export WINEDLLOVERRIDES=${WINEDLLOVERRIDES:-"winegstreamer=d;winevulkan=d"}

          wineboot -u
          sleep 5

          echo "=== Установка библиотек и Media Foundation ==="
          winetricks -q vcrun2015 vcrun2019 d3dcompiler_47 d3dx9 corefonts mf 2>&1 | tee /tmp/winetricks.log || true

      - name: Run Game (create .bat + wrapper and launch)
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          export WINEARCH=win64

          # Ensure GST + WINEDLL envs
          export GST_VIDEOSINK=${GST_VIDEOSINK:-fakesink}
          export GST_AUDIOSINK=${GST_AUDIOSINK:-fakesink}
          export GST_DEBUG=${GST_DEBUG:-2}
          export GST_PLUGIN_SYSTEM_PATH=${GST_PLUGIN_SYSTEM_PATH:-/usr/lib/x86_64-linux-gnu/gstreamer-1.0}
          export GST_REGISTRY=${GST_REGISTRY:-/tmp/gstreamer_registry.bin}
          export GST_DISABLE_REGISTRY_UPDATE=${GST_DISABLE_REGISTRY_UPDATE:-1}
          export WINEDLLOVERRIDES=${WINEDLLOVERRIDES:-"winegstreamer=d;winevulkan=d"}

          # Software rendering (Mesa)
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export MESA_GL_VERSION_OVERRIDE=4.5

          export WINEDEBUG=err+all,fixme-all

          echo "=== Все найденные .exe в game_files ==="
          find game_files -iname "*.exe"

          MAIN_EXE=$(find game_files -type f -iname "*.exe" ! -iname "*unins*" ! -iname "*UnityCrashHandler*" ! -iname "*vcredist*" ! -iname "*dxsetup*" | sort -r | head -n 1)

          if [ -z "$MAIN_EXE" ]; then
            echo "ОШИБКА: Исполняемый .exe файл не найден!"
            exit 1
          fi

          EXE_NAME=$(basename "$MAIN_EXE")
          EXE_DIR=$(dirname "$MAIN_EXE")
          echo "ЗАПУСК ИГРЫ: $MAIN_EXE"
          echo "Создаём run_game.bat и run_wrapper.sh в $EXE_DIR"

          # create relocatable Windows .bat safely
          echo "@echo off" > "$EXE_DIR/run_game.bat"
          echo "\"%~dp0$EXE_NAME\" %*" >> "$EXE_DIR/run_game.bat"

          # create shell wrapper that sets env and runs the .bat via wine cmd
          cat > "$EXE_DIR/run_wrapper.sh" <<'SH'
#!/usr/bin/env bash
export DISPLAY=:99
export WINEPREFIX=$HOME/.wine_prefix
export WINEARCH=win64

# force disabling winegstreamer and winevulkan, and force fakesink for headless CI
export WINEDLLOVERRIDES="winegstreamer=d;winevulkan=d"
export GST_VIDEOSINK=${GST_VIDEOSINK:-fakesink}
export GST_AUDIOSINK=${GST_AUDIOSINK:-fakesink}
export GST_DEBUG=${GST_DEBUG:-2}
export GST_PLUGIN_SYSTEM_PATH=${GST_PLUGIN_SYSTEM_PATH:-/usr/lib/x86_64-linux-gnu/gstreamer-1.0}
export GST_REGISTRY=${GST_REGISTRY:-/tmp/gstreamer_registry.bin}
export GST_DISABLE_REGISTRY_UPDATE=${GST_DISABLE_REGISTRY_UPDATE:-1}

# run the Windows batch via wine cmd
cd "$(dirname "$0")"
wine cmd /c run_game.bat > /tmp/game_output.log 2>&1 &
echo $! > /tmp/game_pid
SH

          chmod +x "$EXE_DIR/run_wrapper.sh"

          # start the wrapper
          (cd "$EXE_DIR" && ./run_wrapper.sh)

          # Wait a bit and print a short status
          sleep 5
          if [ -f /tmp/game_pid ]; then
            echo "Game launched, PID: $(cat /tmp/game_pid)"
          else
            echo "Game process did not start or exited early. Check /tmp/game_output.log"
          fi

      - name: Debug screenshot (без VNC)
        if: always()
        run: |
          export DISPLAY=:99
          import -window root /tmp/screenshot.png || true

      - name: Start VNC and Websockify
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -listen localhost -rfbport 5900 &
          sleep 2

          sudo cp /usr/share/novnc/vnc_lite.html /usr/share/novnc/index.html
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Setup ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ОШИБКА: Секрет NGROK_AUTHTOKEN не задан!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== ССЫЛКА НА VNC (ОТКРЫВАЙ В БРАУЗЕРЕ) ==="
          grep -o 'https://[^\"']*ngrok-free.dev' /tmp/ngrok.log || grep -o 'https://[^\"']*ngrok-free.app' /tmp/ngrok.log || cat /tmp/ngrok.log

      - name: Show Live Game Logs
        run: |
          echo "=========================================="
          echo "=== ПОСЛЕДНИЕ ЛОГИ ИГРЫ (GAME_OUTPUT) ==="
          echo "=========================================="
          if [ -f /tmp/game_output.log ]; then
            tail -n 200 /tmp/game_output.log
          else
            echo "Файл логов /tmp/game_output.log не найден!"
          fi
          echo "=========================================="

      - name: Keep server running
        run: |
          echo "Сервер запущен!"
          sleep 10800
