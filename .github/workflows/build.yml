name: PartyBox Server

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DISPLAY: ":99"
      WINEPREFIX: "/home/runner/.wine_prefix"
      WINEARCH: "win64"
      WINEDEBUG: "-all"
      # Prevent Wine video decoder hangs
      WINEDLLOVERRIDES: "winegstreamer=d;winevulkan=d"
      # Software OpenGL rendering setup for headless Xvfb
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Enable i386 architecture & Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wine64 wine32:i386 xvfb x11vnc curl unzip p7zip-full \
            pulseaudio fluxbox novnc websockify libgl1-mesa-dri \
            mesa-utils jq winetricks cabextract \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good || true

      - name: Install official Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Download and Extract wtd.zip from Release E
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p game_files
          echo "=== Downloading wtd.zip ==="
          gh release download E --pattern "wtd.zip" --dir . --clobber || true

          if [ -f "wtd.zip" ]; then
            7z x "wtd.zip" -ogame_files/ -y
            rm -f wtd.zip
          else
            echo "ERROR: wtd.zip not found in Release E!"
            exit 1
          fi

      - name: Setup Virtual Display & Audio
        run: |
          # Start Xvfb with standard 24-bit color depth
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 3

          # Start Window Manager
          fluxbox > /tmp/fluxbox.log 2>&1 &
          sleep 2

          # Start Audio
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=dummy || true
          pactl set-default-sink dummy || true

      - name: Setup Wine Prefix & Dependencies
        run: |
          wineboot -init || true
          sleep 5

          echo "=== Installing Wine runtime dependencies ==="
          winetricks -q vcrun2015 vcrun2019 d3dcompiler_47 d3dx9 corefonts 2>&1 | tee /tmp/winetricks.log || true

      - name: Run Game Directly
        run: |
          MAIN_EXE=$(find game_files -type f -iname "*.exe" ! -iname "*unins*" ! -iname "*UnityCrashHandler*" ! -iname "*vcredist*" ! -iname "*dxsetup*" | sort -r | head -n 1)

          if [ -z "$MAIN_EXE" ]; then
            echo "ERROR: .exe file not found!"
            exit 1
          fi

          EXE_NAME=$(basename "$MAIN_EXE")
          EXE_DIR=$(dirname "$MAIN_EXE")

          cd "$EXE_DIR"
          echo "Launching game: $EXE_NAME inside $EXE_DIR"

          # Launch Wine directly into standard window mode (force 1280x720 windowed if Unity)
          wine "$EXE_NAME" -screen-width 1280 -screen-height 720 -screen-fullscreen 0 -force-d3d11 > /tmp/game_output.log 2>&1 &
          echo $! > /tmp/game_pid

          sleep 5

      - name: Start VNC and Websockify
        run: |
          x11vnc -display :99 -forever -shared -nopw -listen localhost -rfbport 5900 > /tmp/x11vnc.log 2>&1 &
          sleep 2

          sudo cp /usr/share/novnc/vnc_lite.html /usr/share/novnc/index.html
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          sleep 2

      - name: Setup ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ERROR: NGROK_AUTHTOKEN secret is not set!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== VNC URL ==="
          grep -o 'https://[^\"']*ngrok-free.dev' /tmp/ngrok.log || grep -o 'https://[^\"']*ngrok-free.app' /tmp/ngrok.log || cat /tmp/ngrok.log

      - name: Show Live Logs & Keep Alive
        run: |
          echo "=== GAME LOG TAIL ==="
          if [ -f /tmp/game_output.log ]; then
            tail -n 50 /tmp/game_output.log
          fi
          echo "======================="
          sleep 10800
