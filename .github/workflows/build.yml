name: PartyBox Server CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PartyBox Files
        shell: powershell
        run: |
          echo "Checking PartyBox directory structure..."
          if (Test-Path "PK PartyBox/PartyBox.exe") { Write-Host "PartyBox.exe found." } else { Write-Error "PartyBox.exe missing!"; exit 1 }
          if (Test-Path "PK PartyBox/Intro.mp4") { Write-Host "Intro.mp4 found." } else { Write-Error "Intro.mp4 missing!"; exit 1 }
          if (Test-Path "PK PartyBox/D3D12/D3D12Core.dll") { Write-Host "D3D12Core.dll found." } else { Write-Error "D3D12Core.dll missing!"; exit 1 }

      - name: Setup Direct3D 12 Environment & Launch
        shell: powershell
        run: |
          cd "PK PartyBox"
          # Запуск сервера
          Start-Process -FilePath ".\PartyBox.exe" -ArgumentList "--headless" -NoNewWindow
