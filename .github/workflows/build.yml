name: PartyBox Server with VNC & ngrok

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-vnc-server:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Скачиваем ZIP из последнего GitHub Release и распаковываем
      - name: Download Release Asset
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading latest release asset..."
          gh release download --pattern "*.zip" --dir "$env:GITHUB_WORKSPACE\downloaded"
          
          $zip = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\downloaded" -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            Write-Host "Downloaded archive: $($zip.FullName)"
            echo "Extracting archive..."
            Expand-Archive -Path $zip.FullName -DestinationPath "$env:GITHUB_WORKSPACE\extracted" -Force
          } else {
            Write-Error "No ZIP asset found in the latest release!"
            exit 1
          }

      # 2. Ищем ЛЮБОЙ .exe внутри распакованного архива и выводим структуру
      - name: Locate Executable
        shell: powershell
        run: |
          echo "--- Content of extracted archive ---"
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE\extracted" -Recurse | Select-Object FullName
          
          # Ищем PartyBox.exe или любой .exe внутри
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\extracted" -Recurse -Filter "*.exe" | Select-Object -First 1
          
          if ($exe) {
            Write-Host "FOUND EXE: $($exe.FullName)"
            Add-Content -Path $env:GITHUB_ENV -Value "PARTYBOX_EXE=$($exe.FullName)"
            Add-Content -Path $env:GITHUB_ENV -Value "PARTYBOX_DIR=$($exe.DirectoryName)"
          } else {
            Write-Error "No .exe file found inside the extracted archive!"
            exit 1
          }

      # 3. Установка TightVNC и ngrok
      - name: Install VNC and ngrok
        shell: powershell
        run: |
          choco install tightvnc -y
          choco install ngrok -y

      # 4. Настройка VNC
      - name: Configure and Start VNC Server
        shell: powershell
        run: |
          $vncPass = "123456"
          Set-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "Password" -Value $vncPass -ErrorAction SilentlyContinue
          net start "TightVNC Server"

      # 5. Запуск ngrok
      - name: Start ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        shell: powershell
        run: |
          if (-not $env:NGROK_AUTHTOKEN) {
            Write-Error "NGROK_AUTHTOKEN is missing in GitHub Secrets!"
            exit 1
          }
          ngrok config add-authtoken $env:NGROK_AUTHTOKEN
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 5900" -NoNewWindow

      # 6. Вывод ссылки подключения VNC
      - name: Get VNC Connection URL
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $log = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $publicUrl = $log.tunnels[0].public_url
          echo "===================================================="
          echo "VNC SERVER IS READY!"
          echo "Connect via VNC Viewer to: $publicUrl"
          echo "Default Password: 123456"
          echo "===================================================="

      # 7. Запуск сервера и удержание процесса
      - name: Launch PartyBox Server & Keep Alive
        shell: powershell
        run: |
          Set-Location "$env:PARTYBOX_DIR"
          echo "Launching server executable from $(Get-Location)..."
          
          # Запускаем процесс и сохраняем его объект
          $process = Start-Process -FilePath "$env:PARTYBOX_EXE" -PassThru -NoNewWindow
          
          echo "Server is running (PID: $($process.Id)). Holding runner alive..."
          
          # Ждём завершения процесса сервера (или держим раннер живым)
          $process.WaitForExit()
