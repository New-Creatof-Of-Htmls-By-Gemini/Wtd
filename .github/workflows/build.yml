name: PartyBox Server with VNC & ngrok

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-vnc-server:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Находим zip-архив и распаковываем
      - name: Extract ZIP Archive
        shell: powershell
        run: |
          echo "Looking for ZIP archive..."
          $zip = Get-ChildItem -Recurse -Filter "*.zip" | Select-Object -First 1
          
          if ($zip) {
            Write-Host "Found archive: $($zip.FullName)"
            echo "Extracting archive to 'extracted' folder..."
            Expand-Archive -Path $zip.FullName -DestinationPath "$env:GITHUB_WORKSPACE\extracted" -Force
          } else {
            Write-Error "No ZIP file found in repository!"
            exit 1
          }

      # 2. Ищем PartyBox.exe внутри распакованных файлов
      - name: Locate PartyBox.exe
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\extracted" -Recurse -Filter "PartyBox.exe" | Select-Object -First 1
          
          if ($exe) {
            Write-Host "Found PartyBox.exe at: $($exe.FullName)"
            Add-Content -Path $env:GITHUB_ENV -Value "PARTYBOX_DIR=$($exe.DirectoryName)"
          } else {
            Write-Error "PartyBox.exe not found inside the ZIP archive!"
            exit 1
          }

      # 3. Устанавливаем TightVNC и ngrok
      - name: Install VNC and ngrok
        shell: powershell
        run: |
          choco install tightvnc -y
          choco install ngrok -y

      # 4. Настраиваем и запускаем VNC
      - name: Configure and Start VNC Server
        shell: powershell
        run: |
          $vncPass = "123456"
          Set-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "Password" -Value $vncPass -ErrorAction SilentlyContinue
          net start "TightVNC Server"

      # 5. Запускаем ngrok с твоим NGROK_AUTHTOKEN
      - name: Start ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        shell: powershell
        run: |
          if (-not $env:NGROK_AUTHTOKEN) {
            Write-Error "NGROK_AUTHTOKEN is missing in GitHub Secrets!"
            exit 1
          }
          ngrok config add-authtoken $env:NGROK_AUTHTOKEN
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 5900" -NoNewWindow

      # 6. Выводим ссылку подключения
      - name: Get VNC Connection URL
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $log = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $publicUrl = $log.tunnels[0].public_url
          echo "===================================================="
          echo "VNC SERVER IS READY!"
          echo "Connect via VNC Viewer to: $publicUrl"
          echo "Default Password: 123456"
          echo "===================================================="

      # 7. Запускаем PartyBox из распакованной папки
      - name: Launch PartyBox Server
        shell: powershell
        run: |
          Set-Location "$env:PARTYBOX_DIR"
          echo "Launching PartyBox.exe from $(Get-Location)..."
          Start-Process -FilePath ".\PartyBox.exe" -NoNewWindow
          while ($true) { Start-Sleep -Seconds 60 }
