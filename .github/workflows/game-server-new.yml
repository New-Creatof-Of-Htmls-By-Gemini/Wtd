 name: PartyBox Server

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Enable i386 architecture & Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32:i386 xvfb x11vnc curl unzip p7zip-full pulseaudio fluxbox novnc websockify libgl1 libglx-mesa0 libgl1-mesa-dri jq winetricks cabextract mesa-utils

      - name: Install official Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Download ISO from Wormhole & Extract Game
        run: |
          mkdir -p game_files
          
          echo "=== Установка wormhole-william ==="
          curl -sSL "https://github.com/psanford/wormhole-william/releases/download/v0.8.0/wormhole-william-linux-amd64" -o wormhole
          chmod +x wormhole
          
          echo "=== Скачивание JPP7 ISO с Wormhole ==="
          ./wormhole receive "https://wormhole.app/AyXa3P#uJUkLWtikYCMU-5b7YX3rA" -o game_downloaded.iso
          
          echo "=== Распаковка Jackbox Party Pack 7 ==="
          7z x game_downloaded.iso -ogame_files/ -y
          rm game_downloaded.iso

      - name: Setup Display & Audio
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          export DISPLAY=:99
          fluxbox &
          
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=dummy || true
          pactl set-default-sink dummy || true
          
          sleep 3

      - name: Install Wine Libraries for Unity & Jackbox
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          export WINEARCH=win64
          
          wineboot -u
          sleep 3
          
          echo "=== Установка графических библиотек ==="
          winetricks -q vcrun2015 d3dcompiler_47 d3dx9 || true

      - name: Run Jackbox Party Pack 7
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          export WINEARCH=win64
          
          MAIN_EXE=$(find game_files -type f -iname "*.exe" ! -iname "*unins*" ! -iname "*UnityCrashHandler*" | head -n 1)
          
          if [ -n "$MAIN_EXE" ]; then
            echo "ЗАПУСК GAME В РЕЖИМЕ VIRTUAL DESKTOP: $MAIN_EXE"
            cd "$(dirname "$MAIN_EXE")"
            
            wine "$(basename "$MAIN_EXE")" -popupwindow -screen-width 1280 -screen-height 720 -force-d3d11 > /tmp/game_output.log 2>&1 &
          else
            echo "ОШИБКА: Исполняемый .exe файл не найден!"
            exit 1
          fi

          sleep 5

      - name: Start VNC and Websockify
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -listen localhost -rfbport 5900 &
          sleep 2
          
          sudo cp /usr/share/novnc/vnc_lite.html /usr/share/novnc/index.html
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Setup ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ОШИБКА: Секрет NGROK_AUTHTOKEN не задан!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== ССЫЛКА НА VNC (ОТКРЫВАЙ В БРАУЗЕРЕ) ===" 
          grep -o 'https://[^"]*ngrok-free.dev' /tmp/ngrok.log || grep -o 'https://[^"]*ngrok-free.app' /tmp/ngrok.log || cat /tmp/ngrok.log
      
      - name: Keep server running
        run: |
          echo "Сервер запущен!"
          sleep 36000
          
