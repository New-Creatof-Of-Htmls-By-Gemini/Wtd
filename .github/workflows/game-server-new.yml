name: What The Dub Server

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Enable i386 architecture & Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32:i386 xvfb x11vnc curl unzip p7zip-full pulseaudio fluxbox novnc websockify libgl1 libglx-mesa0 libgl1-mesa-dri
      
      - name: Install official Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Download Game Installer
        run: |
          mkdir -p game_files
          
          # Получаем прямую ссылку на .exe из релиза E
          EXE_URL=$(curl -s https://api.github.com/repos/New-Creatof-Of-Htmls-By-Gemini/Wtd/releases/tags/E | grep "browser_download_url" | cut -d '"' -f 4 | head -n 1)
          
          echo "Found download URL: $EXE_URL"
          
          if [ -z "$EXE_URL" ]; then
            echo "ОШИБКА: Не удалось получить ссылку из релиза E!"
            exit 1
          fi

          curl -sSLf "$EXE_URL" -o setup.exe

      - name: Setup Display, Window Manager & Audio
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          fluxbox &
          pulseaudio --start || true
          sleep 3
      
      - name: Install and Run What the Dub
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          export WINEARCH=win64
          export WINEDLLOVERRIDES="mscoree,mshtml=b"
          
          rm -rf $WINEPREFIX
          wineboot -u
          sleep 5
          
          echo "Запускаем тихую установку..."
          # Запускаем установку в папку C:\game
          wine setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="C:\game" || wine setup.exe /S /D=C:\game
          
          # Ждем завершения установки
          sleep 15
          
          # Ищем установленный .exe внутри виртуального диска Wine (C:)
          MAIN_EXE=$(find $HOME/.wine_prefix/drive_c/ -iname "*WhatTheDub*.exe" ! -iname "*setup*" ! -iname "*unins*" | head -n 1)
          
          if [ -n "$MAIN_EXE" ]; then
            echo "Найден файл игры: $MAIN_EXE"
            GAME_DIR=$(dirname "$MAIN_EXE")
            EXE_NAME=$(basename "$MAIN_EXE")
            cd "$GAME_DIR"
            
            wine "$EXE_NAME" -screen-width 1280 -screen-height 720 -windowed > /tmp/game_output.log 2>&1 &
          else
            echo "ОШИБКА: Игра не установилась!"
            find $HOME/.wine_prefix/drive_c/
            exit 1
          fi
          
          sleep 12
          echo "=== LOGS GAME / WINE ==="
          cat /tmp/game_output.log | tail -n 30 || true
      
      - name: Start VNC and Websockify
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -listen localhost -rfbport 5900 &
          sleep 2
          
          sudo cp /usr/share/novnc/vnc_lite.html /usr/share/novnc/index.html
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2
      
      - name: Setup ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ОШИБКА: Секрет NGROK_AUTHTOKEN не задан!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== ССЫЛКА НА ИГРУ (ОТКРЫВАЙ В БРАУЗЕРЕ) ===" 
          grep -o 'https://[^"]*ngrok-free.dev' /tmp/ngrok.log || grep -o 'https://[^"]*ngrok-free.app' /tmp/ngrok.log || cat /tmp/ngrok.log
      
      - name: Keep server running
        run: |
          echo "Server running..."
          sleep 36000
          
