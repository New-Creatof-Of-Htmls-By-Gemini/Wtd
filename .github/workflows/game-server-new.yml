name: What The Dub Server

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Enable i386 architecture and Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32:i386 xvfb x11vnc curl unzip p7zip-full pulseaudio alsa-utils
      
      - name: Download release asset
        run: |
          curl -L "https://github.com/New-Creatof-Of-Htmls-By-Gemini/Wtd/releases/download/E/WhatTheDub-RU_v2.2.0.4-TDoT-2.3-Setup.exe" -o game.exe
          ls -lh game.exe
      
      - name: Setup X11 display & Audio
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio --start
          sleep 2
      
      - name: Install Wine prefix
        run: |
          export DISPLAY=:99
          export WINEPREFIX=/tmp/wine_prefix
          wineboot -i
          sleep 5
      
      - name: Run What the Dub
        run: |
          export DISPLAY=:99
          export WINEPREFIX=/tmp/wine_prefix
          wine game.exe &
          sleep 10
      
      - name: Start VNC server
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -listen localhost -rfbport 5900 &
          sleep 2
      
      - name: Setup ngrok tunnel
        run: |
          curl -s https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip -o ngrok.zip
          unzip -q ngrok.zip
          chmod +x ngrok
          ./ngrok tcp localhost:5900 > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== NGROK TUNNEL ===" 
          cat /tmp/ngrok.log || echo "Checking ngrok status..."
          ps aux | grep ngrok || echo "ngrok not running yet"
      
      - name: Keep server running
        run: |
          echo "Server running... Check ngrok URL in logs above"
          sleep 36000
          
