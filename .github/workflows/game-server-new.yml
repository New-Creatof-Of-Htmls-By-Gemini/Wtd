name: What The Dub Server

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Enable i386 architecture & Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32:i386 xvfb x11vnc curl unzip p7zip-full pulseaudio fluxbox novnc websockify libgl1 libglx-mesa0 libgl1-mesa-dri jq innoextract
      
      - name: Install official Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Download Game Installer
        run: |
          mkdir -p game_files
          
          EXE_URL=$(curl -s https://api.github.com/repos/New-Creatof-Of-Htmls-By-Gemini/Wtd/releases/tags/E | jq -r '.assets[] | select(.name | test("\\.(exe|iso|zip|7z)$"; "i")) | .browser_download_url' | head -n 1)
          
          if [ -z "$EXE_URL" ] || [ "$EXE_URL" = "null" ]; then
            EXE_URL="https://github.com/New-Creatof-Of-Htmls-By-Gemini/Wtd/releases/download/E/What_the_Dub_rus_v1.01_TDoT.exe"
          fi

          curl -sSLf "$EXE_URL" -o setup.exe || curl -sSLf "https://github.com/New-Creatof-Of-Htmls-By-Gemini/Wtd/releases/download/E/setup.exe" -o setup.exe

      - name: Setup Display, Window Manager & Audio
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          fluxbox &
          pulseaudio --start || true
          sleep 3

      - name: Auto-Extract and Auto-Run Game
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          export WINEARCH=win64
          export WINEDLLOVERRIDES="mscoree,mshtml=b"
          
          wineboot -u
          sleep 3
          
          echo "=== Распаковка через innoextract ==="
          innoextract -d game_files setup.exe || true
          
          echo "=== СПИСОК ВСЕХ НАЙДЕННЫХ .EXE ФАЙЛОВ ==="
          find game_files -type f -iname "*.exe"
          
          # Ищем любой .exe файл, кроме системных утилит и краш-хэндлеров
          MAIN_EXE=$(find game_files -type f -iname "*.exe" ! -iname "*setup*" ! -iname "*unins*" ! -iname "*UnityCrashHandler*" | head -n 1)
          
          if [ -n "$MAIN_EXE" ]; then
            echo "НАЙДЕН ИСПОЛНЯЕМЫЙ ФАЙЛ: $MAIN_EXE"
            GAME_DIR=$(dirname "$MAIN_EXE")
            EXE_NAME=$(basename "$MAIN_EXE")
            cd "$GAME_DIR"
            
            wine "$EXE_NAME" -screen-width 1280 -screen-height 720 -windowed > /tmp/game_output.log 2>&1 &
          else
            echo "ОШИБКА: Ни один подходящий .exe не найден!"
            ls -R game_files
            exit 1
          fi
          
          sleep 10

      - name: Start VNC and Websockify
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -listen localhost -rfbport 5900 &
          sleep 2
          
          sudo cp /usr/share/novnc/vnc_lite.html /usr/share/novnc/index.html
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Setup ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ОШИБКА: Секрет NGROK_AUTHTOKEN не задан!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== ССЫЛКА НА ИГРУ (ОТКРЫВАЙ В БРАУЗЕРЕ) ===" 
          grep -o 'https://[^"]*ngrok-free.dev' /tmp/ngrok.log || grep -o 'https://[^"]*ngrok-free.app' /tmp/ngrok.log || cat /tmp/ngrok.log
      
      - name: Keep server running
        run: |
          echo "Сервер работает!"
          sleep 36000
          
