name: What The Dub Server

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Enable i386 architecture & Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine32:i386 xvfb x11vnc curl unzip p7zip-full pulseaudio alsa-utils novnc websockify
      
      - name: Install official Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Download release asset
        run: |
          curl -L "https://github.com/New-Creatof-Of-Htmls-By-Gemini/Wtd/releases/download/E/WhatTheDub-RU_v2.2.0.4-TDoT-2.3-Setup.exe" -o game.exe
          ls -lh game.exe
      
      - name: Setup X11 display & Audio
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          pulseaudio --start || true
          sleep 2
      
      - name: Run What the Dub (Fixed Wine Prefix)
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          rm -rf $WINEPREFIX
          wineboot -i
          sleep 5
          wine game.exe &
          sleep 10
      
      - name: Start VNC and Websockify
        run: |
          export DISPLAY=:99
          # Запуск VNC
          x11vnc -display :99 -forever -nopw -listen localhost -rfbport 5900 &
          sleep 2
          # Мост из VNC (5900) в WebSockets (6080) для HTML-клиента
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2
      
      - name: Setup ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ОШИБКА: Секрет NGROK_AUTHTOKEN не задан в GitHub Secrets!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== NGROK TUNNEL URL ===" 
          grep -o 'https://[^"]*ngrok-free.app' /tmp/ngrok.log || grep -o 'https://[^"]*ngrok.io' /tmp/ngrok.log || cat /tmp/ngrok.log
      
      - name: Keep server running
        run: |
          echo "Server running... Use ngrok URL in your HTML client"
          sleep 36000
          
