name: PartyBox Server

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Enable i386 architecture & Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32:i386 xvfb x11vnc curl unzip p7zip-full pulseaudio fluxbox novnc websockify libgl1 libglx-mesa0 libgl1-mesa-dri jq

      - name: Install official Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Download PartyBox.zip from Release E
        run: |
          mkdir -p game_files
          
          # Получаем прямую ссылку на PartyBox.zip из релиза E
          ZIP_URL=$(curl -s https://api.github.com/repos/New-Creatof-Of-Htmls-By-Gemini/Wtd/releases/tags/E | jq -r '.assets[] | select(.name | test("PartyBox\\.zip$"; "i")) | .browser_download_url' | head -n 1)
          
          echo "Ссылка на ZIP: $ZIP_URL"
          
          if [ -n "$ZIP_URL" ] && [ "$ZIP_URL" != "null" ]; then
            curl -sSLf "$ZIP_URL" -o partybox.zip
            echo "=== Распаковка PartyBox.zip ==="
            7z x partybox.zip -ogame_files/ -y
          else
            echo "ОШИБКА: PartyBox.zip не найден в релизе E!"
            exit 1
          fi

      - name: Setup Display, Window Manager & Audio
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          fluxbox &
          pulseaudio --start || true
          sleep 3

      - name: Run PartyBox in Wine
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          export WINEARCH=win64
          export WINEDLLOVERRIDES="mscoree,mshtml=b"
          
          wineboot -u
          sleep 3
          
          # Ищем главный .exe лаунчера/инсталлятора
          MAIN_EXE=$(find game_files -type f -iname "*.exe" ! -iname "*unins*" ! -iname "*UnityCrashHandler*" | head -n 1)
          
          if [ -n "$MAIN_EXE" ]; then
            echo "ЗАПУСК PARTYBOX: $MAIN_EXE"
            cd "$(dirname "$MAIN_EXE")"
            wine "$(basename "$MAIN_EXE")" > /tmp/game_output.log 2>&1 &
          else
            echo "ОШИБКА: Исполняемый .exe файл не найден внутри ZIP!"
            ls -R game_files
            exit 1
          fi

          sleep 5

      - name: Start VNC and Websockify
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -listen localhost -rfbport 5900 &
          sleep 2
          
          sudo cp /usr/share/novnc/vnc_lite.html /usr/share/novnc/index.html
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Setup ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ОШИБКА: Секрет NGROK_AUTHTOKEN не задан!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== ССЫЛКА НА VNC (ОТКРЫВАЙ В БРАУЗЕРЕ) ===" 
          grep -o 'https://[^"]*ngrok-free.dev' /tmp/ngrok.log || grep -o 'https://[^"]*ngrok-free.app' /tmp/ngrok.log || cat /tmp/ngrok.log
      
      - name: Keep server running
        run: |
          echo "Сервер запущен!"
          sleep 36000
          
