name: PartyBox Server

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v3

      - name: Enable i386 architecture & Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32:i386 xvfb x11vnc curl unzip p7zip-full \
            pulseaudio fluxbox novnc websockify libgl1 libglx-mesa0 libgl1-mesa-dri jq \
            winetricks cabextract mesa-utils wmctrl xdotool imagemagick \
            mesa-vulkan-drivers vulkan-tools libvulkan1

      - name: Verify software Vulkan (lavapipe) is available
        run: |
          echo "=== ICD файлы ==="
          ls /usr/share/vulkan/icd.d/ || true
          echo "=== vulkaninfo (может быть медленным на llvmpipe) ==="
          LVP_ICD=$(find /usr/share/vulkan/icd.d/ -iname "lvp_icd*.json" | head -n 1)
          VK_ICD_FILENAMES="$LVP_ICD" vulkaninfo --summary || true

      - name: Install official Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Download ISO from GitHub Release E & Extract Game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p game_files
          echo "=== Скачиваем game из Релиза E ==="
          gh release download E --dir . --clobber

          echo "=== Распаковка game ==="
          ARCHIVE_FILE=$(find . -maxdepth 1 \( -iname "*.iso" -o -iname "*.zip" -o -iname "*.7z" \) | head -n 1)
          echo "Найден файл: $ARCHIVE_FILE"
          7z x "$ARCHIVE_FILE" -ogame_files/ -y
          rm -f "$ARCHIVE_FILE"

      - name: Setup Display & Audio
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          sleep 2
          export DISPLAY=:99
          fluxbox &
          sleep 2

          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=dummy || true
          pactl set-default-sink dummy || true

          sleep 3

      - name: Install Wine Libraries for Unity & Game
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          export WINEARCH=win64

          wineboot -u
          sleep 5

          echo "=== Установка библиотек (это может занять несколько минут) ==="
          winetricks -q vcrun2015 vcrun2019 d3dcompiler_47 d3dx9 corefonts 2>&1 | tee /tmp/winetricks.log || true

      - name: Install DXVK (fallback DirectX -> Vulkan, на случай если -force-vulkan не сработает)
        run: |
          export WINEPREFIX=$HOME/.wine_prefix

          DXVK_VER=$(curl -s https://api.github.com/repos/doitsujin/dxvk/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "DXVK версия: $DXVK_VER"
          curl -L -o /tmp/dxvk.tar.gz "https://github.com/doitsujin/dxvk/releases/download/v${DXVK_VER}/dxvk-${DXVK_VER}.tar.gz"
          tar -xzf /tmp/dxvk.tar.gz -C /tmp

          DXVK_DIR="/tmp/dxvk-${DXVK_VER}"
          cp "$DXVK_DIR"/x64/*.dll "$WINEPREFIX/drive_c/windows/system32/"
          cp "$DXVK_DIR"/x32/*.dll "$WINEPREFIX/drive_c/windows/syswow64/"

          for dll in d3d9 d3d10core d3d11 dxgi; do
            WINEPREFIX=$WINEPREFIX WINEARCH=win64 wine reg add "HKEY_CURRENT_USER\Software\Wine\DllOverrides" /v $dll /d native /f
          done

      - name: Run Game
        run: |
          export DISPLAY=:99
          export WINEPREFIX=$HOME/.wine_prefix
          export WINEARCH=win64

          # Программный рендеринг Mesa (fallback для OpenGL/wined3d)
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export MESA_GL_VERSION_OVERRIDE=4.5
          # Программный Vulkan (lavapipe) — нужен и для -force-vulkan, и для DXVK
          # Путь ищем динамически, т.к. имя файла менялось между версиями Mesa/Ubuntu
          LVP_ICD=$(find /usr/share/vulkan/icd.d/ -iname "lvp_icd*.json" | head -n 1)
          echo "Найден lavapipe ICD: $LVP_ICD"
          export VK_ICD_FILENAMES="$LVP_ICD"
          # Wine debug лог — критично для диагностики черного экрана
          export WINEDEBUG=err+all,fixme-all

          echo "=== Все найденные .exe в game_files ==="
          find game_files -iname "*.exe"

          MAIN_EXE=$(find game_files -type f -iname "*.exe" ! -iname "*unins*" ! -iname "*UnityCrashHandler*" ! -iname "*vcredist*" ! -iname "*dxsetup*" | sort -r | head -n 1)

          if [ -z "$MAIN_EXE" ]; then
            echo "ОШИБКА: Исполняемый .exe файл не найден!"
            exit 1
          fi

          echo "ЗАПУСК ИГРЫ: $MAIN_EXE"
          cd "$(dirname "$MAIN_EXE")"

          # ВАЖНО: -force-vulkan убран. Большинство Unity-игр собраны под DirectX,
          # а не под нативный Vulkan-рендерер. Форсирование Vulkan на такой сборке
          # даёт открытое, но полностью чёрное окно (API инициализируется, рендер — нет).
          # Вместо этого игра идёт по DirectX-пути, а уже установленный DXVK
          # сам транслирует DirectX -> Vulkan (lavapipe).
          wine explorer /desktop=game,1280x720 "$(basename "$MAIN_EXE")" -screen-width 1280 -screen-height 720 > /tmp/game_output.log 2>&1 &
          GAME_PID=$!

          echo "=== Ожидание появления окна игры (до 150 сек, софтверный рендеринг медленный) ==="
          for i in $(seq 1 30); do
            sleep 5
            if ! kill -0 $GAME_PID 2>/dev/null; then
              echo "!!! Процесс игры завершился раньше времени (крашнулся). Смотри /tmp/game_output.log"
              break
            fi
            if [ "$i" -eq 12 ]; then
              import -window root /tmp/screenshot_60s.png || true
              echo "Промежуточный скриншот сохранён (60 сек)"
            fi
            if wmctrl -l | grep -qi "game\|wine"; then
              echo "Окно найдено на попытке $i"
              wmctrl -a "game" || wmctrl -a "Wine" || true
              break
            fi
            echo "Попытка $i: окно ещё не появилось, процесс жив..."
          done

          echo "=== Список окон ==="
          wmctrl -l || true
          echo "=== Последние строки лога игры ==="
          tail -n 60 /tmp/game_output.log || true

      - name: Debug screenshot (без VNC)
        if: always()
        run: |
          export DISPLAY=:99
          import -window root /tmp/screenshot.png || true

      - name: Start VNC and Websockify
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -listen localhost -rfbport 5900 &
          sleep 2

          sudo cp /usr/share/novnc/vnc_lite.html /usr/share/novnc/index.html
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Setup ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ОШИБКА: Секрет NGROK_AUTHTOKEN не задан!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== ССЫЛКА НА VNC (ОТКРЫВАЙ В БРАУЗЕРЕ) ==="
          grep -o 'https://[^"]*ngrok-free.dev' /tmp/ngrok.log || grep -o 'https://[^"]*ngrok-free.app' /tmp/ngrok.log || cat /tmp/ngrok.log

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            /tmp/game_output.log
            /tmp/winetricks.log
            /tmp/ngrok.log
            /tmp/screenshot.png
            /tmp/screenshot_60s.png
          retention-days: 3

      - name: Keep server running
        run: |
          echo "Сервер запущен!"
          sleep 36000
