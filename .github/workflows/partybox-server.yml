name: PartyBox Server (Proton)

on:
  push:
  workflow_dispatch:

jobs:
  game-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v3

      - name: Enable i386 architecture & Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc curl unzip p7zip-full pulseaudio fluxbox novnc websockify libgl1 libglx-mesa0 libgl1-mesa-dri jq cabextract mesa-utils wmctrl wget tar

      - name: Install GE-Proton Runner
        run: |
          echo "=== Скачиваем GE-Proton ==="
          mkdir -p $HOME/proton
          curl -s https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest \
          | jq -r '.assets[] | select(.name | contains("tar.gz")) | .browser_download_url' \
          | head -n 1 | xargs wget -qO- | tar -xz -C $HOME/proton --strip-components=1
          echo "GE-Proton успешно установлен!"

      - name: Install official Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Download ISO from GitHub Release E & Extract Game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p game_files
          echo "=== Скачиваем game из Релиза E ==="
          gh release download E --dir . --clobber
          
          echo "=== Распаковка game ==="
          ARCHIVE_FILE=$(find . -maxdepth 1 \( -iname "*.iso" -o -iname "*.zip" -o -iname "*.7z" \) | head -n 1)
          echo "Найден файл: $ARCHIVE_FILE"
          7z x "$ARCHIVE_FILE" -ogame_files/ -y
          rm -f "$ARCHIVE_FILE"

      - name: Setup Display & Audio
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          export DISPLAY=:99
          fluxbox &
          
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=dummy || true
          pactl set-default-sink dummy || true
          
          sleep 3

      - name: Run Game via Proton
        run: |
          export DISPLAY=:99
          export STEAM_COMPAT_DATA_PATH=$HOME/proton_pfx
          export STEAM_COMPAT_CLIENT_INSTALL_PATH=$HOME/proton
          
          # Форсируем программный рендеринг Mesa
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export MESA_GL_VERSION_OVERRIDE=4.5
          export PROTON_USE_WINED3D=1
          
          MAIN_EXE=$(find game_files -type f -iname "*.exe" ! -iname "*unins*" ! -iname "*UnityCrashHandler*" | head -n 1)
          
          if [ -n "$MAIN_EXE" ]; then
            echo "ЗАПУСК ИГРЫ ЧЕРЕЗ PROTON: $MAIN_EXE"
            cd "$(dirname "$MAIN_EXE")"
            
            # Запуск игры через бинарник Proton
            $HOME/proton/proton run "$(basename "$MAIN_EXE")" -force-opengl -screen-width 1280 -screen-height 720 > /tmp/game_output.log 2>&1 &
            
            sleep 15
            wmctrl -a "game" || wmctrl -a "Wine" || wmctrl -a "Jackbox" || true
          else
            echo "ОШИБКА: Исполняемый .exe файл не найден!"
            exit 1
          fi

      - name: Start VNC and Websockify
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -listen localhost -rfbport 5900 &
          sleep 2
          
          sudo cp /usr/share/novnc/vnc_lite.html /usr/share/novnc/index.html
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Setup ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ОШИБКА: Секрет NGROK_AUTHTOKEN не задан!"
            exit 1
          fi
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          echo "=== ССЫЛКА НА VNC (ОТКРЫВАЙ В БРАУЗЕРЕ) ===" 
          grep -o 'https://[^"]*ngrok-free.dev' /tmp/ngrok.log || grep -o 'https://[^"]*ngrok-free.app' /tmp/ngrok.log || cat /tmp/ngrok.log
      
      - name: Keep server running
        run: |
          echo "Сервер запущен!"
          sleep 36000
          
