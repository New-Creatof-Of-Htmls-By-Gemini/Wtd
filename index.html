<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What The Dub - Stream & Controls</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        h1 { margin: 10px 0; font-size: 1.5rem; }
        #screen-container {
            width: 100%;
            max-width: 960px;
            height: 540px;
            background: #000;
            border: 2px solid #333;
            position: relative;
        }
        #noVNC_canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 10px;
            margin-top: 15px;
        }
        .v-btn {
            background: #1e1e1e;
            color: white;
            border: 1px solid #555;
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            text-align: center;
            user-select: none;
        }
        .v-btn:active { background: #333; }
        .wide { grid-column: span 3; }
    </style>
</head>
<body>

    <h1>What The Dub - Remote Play</h1>
    
    <!-- Окно стрима игры -->
    <div id="screen-container">
        <div id="noVNC_container" style="width:100%; height:100%;"></div>
    </div>

    <!-- Виртуальная клавиатура для управления в игре -->
    <div class="controls">
        <div></div>
        <div class="v-btn" ontouchstart="sendKey('Up')" onmousedown="sendKey('Up')">⬆️</div>
        <div></div>
        <div class="v-btn" ontouchstart="sendKey('Left')" onmousedown="sendKey('Left')">⬅️</div>
        <div class="v-btn" ontouchstart="sendKey('Return')" onmousedown="sendKey('Return')">🟢 Enter</div>
        <div class="v-btn" ontouchstart="sendKey('Right')" onmousedown="sendKey('Right')">➡️</div>
        <div></div>
        <div class="v-btn" ontouchstart="sendKey('Down')" onmousedown="sendKey('Down')">⬇️</div>
        <div></div>
        <div class="v-btn wide" ontouchstart="sendKey('Space')" onmousedown="sendKey('Space')">Пробел (Space)</div>
    </div>

    <!-- Подключаем noVNC клиент -->
    <script type="module">
        import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/lib/rfb.js';

        let rfb;
        // Укажи хост и порт от ngrok (например, если ngrok дал tcp://0.tcp.ngrok.io:12345, 
        // то для вебсокетов нужен адрес через wss:// или ws://, либо используй ngrok http туннель)
        const host = prompt("Введите хост ngrok (например: 0.tcp.ngrok.io):", "localhost");
        const port = prompt("Введите порт ngrok:", "5900");

        function connectedToServer(e) {
            console.log("Connected to VNC server");
        }

        function disconnectedFromServer(e) {
            console.log("Disconnected", e);
        }

        window.onload = function() {
            // Инициализация noVNC (обрати внимание, что для raw TCP ngrok нужен специальный tcp-websocket прокси,
            // либо лучше запускать ngrok http наносекундный веб-сервер, но для VNC используют wss)
            const url = `ws://${host}:${port}`;
            rfb = new RFB(document.getElementById('noVNC_container'), url, {
                credentials: { password: '' }
            });
            rfb.addEventListener("connect", connectedToServer);
            rfb.addEventListener("disconnect", disconnectedFromServer);
            rfb.scaleWithWindow = true;
            rfb.resizeSession = true;
        };

        window.sendKey = function(keysymName) {
            if (!rfb) return;
            // Эмуляция нажатия клавиш клавиатуры
            let keysym = 0;
            if (keysymName === 'Return') keysym = 0xFF0D;
            if (keysymName === 'Space') keysym = 0x0020;
            if (keysymName === 'Up') keysym = 0xFF52;
            if (keysymName === 'Down') keysym = 0xFF54;
            if (keysymName === 'Left') keysym = 0xFF51;
            if (keysymName === 'Right') keysym = 0xFF53;

            rfb.sendKey(keysym, true);
            setTimeout(() => rfb.sendKey(keysym, false), 100);
        };
    </script>
</body>
</html>
