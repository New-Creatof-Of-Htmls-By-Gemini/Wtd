 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What The Dub - Remote Play</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin: 15px 0 5px 0; font-size: 1.4rem; }
        .connection-box {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        input {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            width: 280px;
        }
        button.connect-btn {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            background: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        #screen-container {
            width: 100%;
            max-width: 960px;
            height: 540px;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 10px;
            margin: 15px 0;
        }
        .v-btn {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 15px 5px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            text-align: center;
            user-select: none;
            touch-action: manipulation;
        }
        .v-btn:active { background: #444; transform: scale(0.98); }
        .v-btn.danger { background: #d9534f; border-color: #d43f3a; }
        .wide { grid-column: span 3; }
    </style>
</head>
<body>

    <h1>What The Dub Remote</h1>
    
    <div class="connection-box">
        <input type="text" id="ngrokUrl" placeholder="Вставь ngrok URL (без https://)">
        <button class="connect-btn" onclick="connectVNC()">Подключиться</button>
    </div>

    <!-- Экран трансляции -->
    <div id="screen-container">
        <div id="noVNC_container" style="width:100%; height:100%;"></div>
    </div>

    <!-- Клавиатура с кнопкой Esc -->
    <div class="controls">
        <div class="v-btn danger" ontouchstart="sendKey('Escape')" onmousedown="sendKey('Escape')">🔴 ESC</div>
        <div class="v-btn" ontouchstart="sendKey('Up')" onmousedown="sendKey('Up')">⬆️</div>
        <div class="v-btn" ontouchstart="sendKey('Return')" onmousedown="sendKey('Return')">🟢 Enter</div>
        
        <div class="v-btn" ontouchstart="sendKey('Left')" onmousedown="sendKey('Left')">⬅️</div>
        <div class="v-btn" ontouchstart="sendKey('Down')" onmousedown="sendKey('Down')">⬇️</div>
        <div class="v-btn" ontouchstart="sendKey('Right')" onmousedown="sendKey('Right')">➡️</div>
        
        <div class="v-btn wide" ontouchstart="sendKey('Space')" onmousedown="sendKey('Space')">Пробел (Space)</div>
    </div>

    <script type="module">
        import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/lib/rfb.js';

        let rfb;

        window.connectVNC = function() {
            let rawUrl = document.getElementById('ngrokUrl').value.trim();
            if (!rawUrl) return alert("Введите URL из логов GitHub Actions!");

            // Форматируем URL для WebSocket
            rawUrl = rawUrl.replace('https://', '').replace('http://', '');
            const wsUrl = `wss://${rawUrl}/websockify`;

            if (rfb) rfb.disconnect();

            rfb = new RFB(document.getElementById('noVNC_container'), wsUrl);
            rfb.scaleWithWindow = true;
            rfb.resizeSession = true;

            rfb.addEventListener("connect", () => console.log("Успешно подключено к игре!"));
            rfb.addEventListener("disconnect", (e) => console.log("Отключено:", e));
        };

        window.sendKey = function(keysymName) {
            if (!rfb) return;
            
            // Коды клавиш X11 Keysym
            const keyMap = {
                'Escape': 0xFF1B,
                'Return': 0xFF0D,
                'Space': 0x0020,
                'Up': 0xFF52,
                'Down': 0xFF54,
                'Left': 0xFF51,
                'Right': 0xFF53
            };

            const keysym = keyMap[keysymName];
            if (keysym) {
                rfb.sendKey(keysym, true);
                setTimeout(() => rfb.sendKey(keysym, false), 100);
            }
        };
    </script>
</body>
</html>
